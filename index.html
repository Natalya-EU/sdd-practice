<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой прогресс</title>
<style>
  /* ===== ВНЕШНИЙ ВИД (блок Design из спеки) ===== */
  body {
    margin: 0; padding: 60px;
    background: #F5F6FA;                    /* светлый фон страницы */
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .fields { display: flex; gap: 48px; margin-bottom: 48px; }
  label {
    color: #1E2A4A; font-size: 24px;
    display: flex; align-items: baseline; gap: 10px;
  }
  input {
    width: 90px; font-size: 24px; color: #1E2A4A;
    background: transparent; border: none;
    border-bottom: 2px solid #1E2A4A;       /* поля-подчёркивания как в макете */
    outline: none;
  }
  input:focus { border-bottom-color: #5deb28; }
  .track {
    position: relative; height: 110px; border-radius: 14px;
    background: linear-gradient(90deg, #000c22, #1856c8);  /* градиент на линейке */
    overflow: hidden;
  }
  .caption {
    position: absolute; left: 44px; top: 50%;
    transform: translateY(-50%);
    color: #FFFFFF; font-size: 26px;        /* подпись внутри линейки */
  }
  .runner {
    position: absolute; top: 0; bottom: 0; width: 16px;
    border-radius: 8px; background: #5deb28; /* салатовый бегунок */
    left: 0%; transform: translateX(-50%);
    transition: left .3s;                    /* плавное движение */
  }
</style>
</head>
<body>

<!-- ===== СТРУКТУРА (блок UI Structure из спеки) ===== -->
<div class="fields">
  <label>Старт <input id="start" inputmode="decimal"></label>
  <label>Сегодня <input id="today" inputmode="decimal"></label>
  <label>Цель <input id="goal" inputmode="decimal"></label>
</div>
<div class="track">
  <div class="caption" id="caption"></div>
  <div class="runner" id="runner"></div>
</div>

<script>
// ===== ЛОГИКА (блоки Logic и Edge Cases из спеки) =====
const inputs = {
  start: document.getElementById('start'),
  today: document.getElementById('today'),
  goal:  document.getElementById('goal')
};
const runner  = document.getElementById('runner');
const caption = document.getElementById('caption');

// Загрузка сохранённых значений из localStorage (требование спеки)
const saved = JSON.parse(localStorage.getItem('weightTracker') || '{}');
inputs.start.value = saved.start || '';
inputs.today.value = saved.today || '';
inputs.goal.value  = saved.goal  || '';

// Превращаем текст поля в число (запятая или точка — обе работают)
function parse(v) {
  const n = parseFloat(v.replace(',', '.'));
  return isNaN(n) ? null : n;
}

// Буквы молча удаляются из поля (edge case из спеки, без подсказок)
function sanitize(el) {
  const clean = el.value.replace(/[^\d.,]/g, '');
  if (clean !== el.value) el.value = clean;
}

// Сохраняем все три значения в localStorage
function save() {
  localStorage.setItem('weightTracker', JSON.stringify({
    start: inputs.start.value,
    today: inputs.today.value,
    goal:  inputs.goal.value
  }));
}

// Округление до 0,1 и запятая вместо точки (как принято в русском)
function fmt(n) {
  return (Math.round(n * 10) / 10).toString().replace('.', ',');
}

// Главный пересчёт: позиция бегунка + подпись
function recalc() {
  const s = parse(inputs.start.value);
  const t = parse(inputs.today.value);
  const g = parse(inputs.goal.value);

  // Edge case: не все поля заполнены или цель >= старта —
  // бегунок в начале, подписи нет
  if (s === null || t === null || g === null || s <= g) {
    runner.style.left = '0%';
    caption.textContent = '';
    return;
  }

  // Формула из спеки: (Старт − Текущий) / (Старт − Цель) × 100,
  // ограничено рамками 0..100
  let progress = (s - t) / (s - g) * 100;
  progress = Math.max(0, Math.min(100, progress));
  runner.style.left = progress + '%';

  // Edge case: цель достигнута
  if (t <= g) {
    caption.textContent = '🎉 Цель достигнута!';
    return;
  }

  // Подпись: сколько скинуто и сколько осталось
  const lost = Math.max(0, s - t);
  const left = Math.max(0, t - g);
  caption.textContent =
    'Жизнь стала легче на ' + fmt(lost) + ' кг, осталось еще ' + fmt(left) + ' кг';
}

// Поле «Сегодня»: санация, АВТОЗАМЕНА старта, сохранение, пересчёт
inputs.today.addEventListener('input', () => {
  sanitize(inputs.today);
  const s = parse(inputs.start.value);
  const t = parse(inputs.today.value);
  // Правило v3: срабатывает ТОЛЬКО при вводе в «Сегодня»
  if (s !== null && t !== null && t > s) {
    inputs.start.value = inputs.today.value;
  }
  save();
  recalc();
});

// Поля «Старт» и «Цель»: ручное значение не перепроверяется (решение v3)
inputs.start.addEventListener('input', () => { sanitize(inputs.start); save(); recalc(); });
inputs.goal.addEventListener('input',  () => { sanitize(inputs.goal);  save(); recalc(); });

// Пересчёт при открытии страницы (если данные пришли из localStorage)
recalc();
</script>
</body>
</html>
